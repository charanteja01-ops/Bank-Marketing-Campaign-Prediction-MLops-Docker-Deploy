apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-mlops-app
  namespace: default
  labels:
    app: bank-mlops-app
    model-champion: xgboost
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bank-mlops-app
  template:
    metadata:
      labels:
        app: bank-mlops-app
        model-champion: xgboost
    spec:
      containers:
        - name: streamlit-app
          image: bank-mlops-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: STREAMLIT_SERVER_HEADLESS
              value: "true"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5