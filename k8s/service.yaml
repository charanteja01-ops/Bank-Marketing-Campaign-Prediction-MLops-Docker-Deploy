apiVersion: v1
kind: Service
metadata:
  name: bank-mlops-service
  namespace: default
  labels:
    app: bank-mlops-app
    model-champion: xgboost
spec:
  type: NodePort
  selector:
    app: bank-mlops-app
  ports:
    - name: http
      protocol: TCP
      port: 8501
      targetPort: 8501
      nodePort: 30501