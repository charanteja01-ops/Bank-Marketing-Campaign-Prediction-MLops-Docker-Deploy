experiment_name: bank_marketing_campaign
random_state: 42
test_size: 0.2
cv_folds: 5
n_trials: 40

data:
  # UCI "bank-full.csv" (sep ';', target 'y'). For bank-additional-full.csv keep
  # the same settings; for the Kaggle bank.csv use sep ',' and target 'deposit'.
  raw_path: data/raw/bank.csv
  separator: ","
  target: deposit
  positive_label: "yes"
  # 'duration' is only known AFTER the call ends, so it leaks the outcome.
  # Keep it dropped for a realistic "who should we call?" model.
  drop_columns: ["duration"]

metric:
  # Use 'accuracy' for raw accuracy, or keep 'f1' / 'roc_auc' / 'average_precision'
  # for imbalanced (~12% 'yes') bank marketing data.
  primary: accuracy

selection:
  max_score_gap_pct: 12.0         # relaxed gap limit so high-scoring models stay eligible
  score_tolerance_pct: 0.2        # near-strict highest score priority
  gap_penalty_in_search: true
  gap_penalty_weight: 0.25        # light penalty so Optuna focuses on validation score
  fallback_if_none_eligible: smallest_gap
  weights:
    model_size_mb: 0.2
    training_time_seconds: 0.3
    prediction_time_ms: 0.5

measurement:
  training_time_repeats: 3
  prediction_n_samples: 50
  prediction_repeats: 3